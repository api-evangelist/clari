name: Clari
description: Clari is an enterprise revenue orchestration platform that publishes three
  machine surfaces. The Clari Revenue API v5 (api.clari.com/v4) is an asynchronous,
  job-based export and ingest surface — queue a forecast, activity or audit export, poll
  until the job reads DONE, then download the results — plus a partner Ingestion API for
  pushing third-party data into Clari accounts and opportunities. The Clari Copilot REST
  API (rest-api.copilot.clari.com) is a synchronous conversation-intelligence and CRM
  surface covering calls, transcripts, AI summaries, action items, competitor sentiment,
  coaching scorecards, and CRUD over accounts, contacts and deals keyed on the customer's
  own CRM id. Clari also runs a first-party remote MCP server at mcp.clari.com/mcp, OAuth
  protected via Okta and listed natively in the Claude connector directory, which exposes
  live Clari + Salesloft revenue context to AI agents. Both HTTP APIs authenticate with
  header API keys, support no idempotency keys, and return no rate-limit headers.
