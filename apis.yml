- aid: clari:clari-mcp-server
  name: Clari MCP Server
  description: >-
    Clari's first-party remote Model Context Protocol server. It exposes live Clari + Salesloft revenue
    context — accounts, deals, people, calls and conversation intelligence, cadences and activity, team
    metrics, and (rolling out through late summer 2026) forecasting and deal inspection — to any MCP client.
    Listed natively in the Claude connector directory and available as a custom connector for ChatGPT,
    Microsoft Copilot and Google Gemini. OAuth 2.0 via Okta; tools/list is auth-gated.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://community.clari.com/product-updates/august-2026-new-feature-release-notes-3009
