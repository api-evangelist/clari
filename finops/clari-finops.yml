name: Clari FinOps
description: >-
  FinOps Framework FOCUS-aligned cost and usage tracking model for Clari platform and
  API consumption. Clari is sold as a modular subscription with no consumption-based
  API pricing; API access is bundled within platform subscriptions. IMPORTANT: Clari
  publishes NO prices — https://www.clari.com/pricing/ names no tier and no amount,
  only a "Get a quote" form. Every column below is a cost-tracking SHAPE for a
  customer's own billing data, not a Clari price list. Any dollar figure a reader
  needs must come from their own contract.
