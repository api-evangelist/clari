costOptimizationGuidance:
  - category: License Right-Sizing
    description: Audit active vs. inactive users quarterly. Remove or reassign
      seats for users not accessing Clari within 30 days to avoid paying for
      unused licenses.
  - category: Module Consolidation
    description: Evaluate whether all licensed products (Clari, Clari Copilot, Groove by
      Clari) are actively used. Consolidate to only necessary ones at renewal.
  - category: Negotiation Leverage
    description: Clari pricing is heavily negotiable. Use competitive alternatives
      (Gong, Salesforce, Outreach) as leverage. Clari publishes no list price and no
      discount schedule, so benchmark against your own prior contract, not a public rate.
  - category: Renewal Management
    description: Read the uplift and auto-renewal terms in your own agreement — Clari
      publishes no renewal-increase schedule. Begin renegotiation well before expiration.
  - category: API Quota Monitoring
    description: Use GET /admin/limits to monitor export quota consumption. The
      organization's rolling-30-day export quota and concurrent-job limit are
      tenant-specific and unpublished — /admin/limits is the only way to read yours.
      Cancelling an in-progress job via PATCH /export/jobs/{jobId} frees quota back up.
  - category: Implementation Cost Control
    description: Scope professional services against your own statement of work — Clari
      publishes no implementation price. Leverage the Clari community and self-serve
      documentation to reduce reliance on paid services.
