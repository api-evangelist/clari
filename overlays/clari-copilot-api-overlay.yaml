overlay: 1.0.0
info:
  title: API Evangelist enhancements for rest-api
  version: 1.0.0
x-provenance:
  generated: '2026-08-13'
  method: generated
  source: openapi/clari-copilot-api-openapi.yml
  note: Captures API Evangelist enrichment as an OpenAPI Overlay 1.0.0 so the harvested specification
