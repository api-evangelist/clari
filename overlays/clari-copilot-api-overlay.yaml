extends: openapi/clari-copilot-api-openapi.yml
actions:
- target: $.info
  description: Record the API Evangelist profile and the canonical documentation entry point for this
    API.
  update:
    x-api-evangelist:
      profile: https://apis.io/provider/clari/
      repository: https://github.com/api-evangelist/clari
      artifacts:
      - authentication/clari-authentication.yml
      - conventions/clari-conventions.yml
      - errors/clari-problem-types.yml
      - lifecycle/clari-lifecycle.yml
      - rate-limits/clari-rate-limits.yml
- target: $.info
  description: The published info.title is the generic string "rest-api". Name the API for humans and
    agents without mutating the source document.
  update:
    x-display-title: Clari Copilot REST API
- target: $.servers[0]
  description: Record that this host replaced the deprecated Wingman host, whose support window closed
    2023-12-31.
  update:
    x-replaces: https://rest-api.trywingman.com
    x-replaced-on: '2023-12-31'
- target: $.paths.*.*
  description: Clari supports no Idempotency-Key header and returns no rate-limit or Retry-After headers
    on any operation. Record both absences so an agent plans retries correctly.
  update:
    x-idempotency:
      supported: false
      header: null
    x-rate-limit-headers:
      published: false
      retry_after: false
