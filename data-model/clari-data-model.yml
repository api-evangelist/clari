- name: Scorecard
  api: copilot
  operations: ['GET /scorecard']
  relationships:
  - type: belongs_to
    target: Call
    via: call_id
  - type: belongs_to
    target: ScoreCardTemplate
    via: template_id
  - type: has_many
    target: ScorecardQuestion
    via: questions_score
- name: ScoreCardTemplate
  api: copilot
  operations: ['GET /scorecard-template']
  relationships:
  - type: has_many
    target: ScorecardTemplateQuestion
    via: questions
- name: Topic
  api: copilot
  operations: ['GET /topics', 'GET /v2/topics']
  note: Two live generations of the same resource; Clari does not say which is canonical.
- name: ExportJob
  api: revenue
  description: Asynchronous export job — the central object of the Revenue API.
  operations: ['GET /export/jobs', 'GET /export/jobs/{jobId}', 'PATCH /export/jobs/{jobId}', 'GET /export/jobs/{jobId}/results']
  key: jobId
  states: [queued, running, DONE]
  relationships:
  - type: has_one
    target: ExportResults
    via: /export/jobs/{jobId}/results
  created_by:
  - 'POST /export/forecast/{forecastId}'
  - 'POST /export/activity'
  - 'POST /export/audit/events'
- name: IngestJob
  api: revenue
  operations: ['GET /ingest/job/{jobId}']
  key: jobId
  created_by:
  - 'POST /ingest/bulk/entity/{entity}'
  - 'POST /ingest/entity/{entity}'
  note: All-or-nothing batch validation — a single invalid record rejects the whole batch.
- name: Entity
  api: revenue
  description: A named ingest target type (account, opportunity).
  operations: ['POST /ingest/entity/{entity}', 'POST /ingest/bulk/entity/{entity}', 'GET /ingest/schema/{entity}/field', 'POST /ingest/schema/{entity}/field']
  relationships:
  - type: has_many
    target: PicklistField
    via: /ingest/schema/{entity}/field
- name: Opportunity
  api: revenue
  operations: ['GET /opportunity']
  note: The only synchronous typed read on the Revenue API.
- name: AuditEvent
  api: revenue
  operations: ['GET /audit/events', 'POST /export/audit/events']
  pagination: paginationToken, limit 1-1000 (default 100)
- name: Forecast
  api: revenue
  operations: ['POST /export/forecast/{forecastId}']
  key: forecastId
  note: Export-only. There is no GET /forecast; forecast data leaves Clari as a job result file.

cross_api_joins:
  published: false
  note: >-
    Nothing in either contract joins a Copilot Call/Deal to a Revenue API
    Opportunity or Forecast. The practical join key is the customer's own CRM id
    (crm_id on the Copilot side), which the Revenue API never returns in a typed field.
    Any agent stitching the two surfaces is doing so on inference, not on a published
    relationship.

