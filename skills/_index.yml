cross_cutting_rules:
- Clari supports no Idempotency-Key header on any of its 35 published operations. Every skill states the safe retry pattern for its own flow.
- Clari returns no Retry-After, X-RateLimit-* or RateLimit-* headers. Backoff is blind; GET /admin/limits is the only programmatic budget signal.
- Export quota exhaustion is reported as HTTP 400, not 429.
- The two APIs use two different auth schemes and two different error envelopes. Never carry a client abstraction across them.
