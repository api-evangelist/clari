source: live HTTP probes of every Clari host named in apis.yml and in the OpenAPI servers[]
name: Clari .well-known probe
description: >-
  Probe of the standard /.well-known/ discovery paths across every Clari host. The
  marketing site (www.clari.com) answers HTTP 200 with the same 51KB HTML shell for
  every unknown path, so its 200s are soft-404s and are recorded as misses, not
  documents. The real hits are the MCP OAuth metadata documents served by the Kong
  gateway on mcp.clari.com and api.clari.com, which advertise the Clari MCP Server
  as an OAuth 2.0 protected resource backed by Okta (clariciam.okta.com).
hosts:
- host: mcp.clari.com
  paths:
  - path: /.well-known/oauth-protected-resource/mcp
    status: 200
    content_type: application/json
    document: true
    file: well-known/clari-mcp-oauth-protected-resource.json
    note: >-
      Real RFC 9728 protected-resource metadata. resource_name "Clari MCP Server",
      resource https://mcp.clari.com/mcp, scopes_supported [openid, profile].
  - path: /.well-known/oauth-authorization-server/mcp
    status: 200
    content_type: application/json
    document: true
    file: well-known/clari-mcp-oauth-authorization-server.json
    note: >-
      Real RFC 8414 authorization-server metadata. issuer
      https://clariciam.okta.com/oauth2/aus13shznanP7WOkp698, authorization_endpoint
      https://app.clari.com/authorize, dynamic client registration at
      https://mcp.clari.com/okta/clients, PKCE S256, DPoP supported.
  - path: /.well-known/oauth-authorization-server
    status: 404
    document: false
  - path: /
    status: 404
    document: false
- host: api.clari.com
  paths:
