name: Clari client packages
description: >-
  Clari publishes NO first-party client SDK on any public package registry. Both
  published APIs — the Clari Revenue API v5 and the Clari Copilot REST API — are
  documented as raw HTTP with header authentication and are expected to be called
  directly. The only code Clari ships to developers is two downloadable Python
  example scripts linked from the Copilot ReDoc page; they are samples, not a
  distributed, versioned library, so they carry no registry metadata.
