name: Clari Plans and Pricing
description: >-
  Clari publishes NO plans and NO prices. https://www.clari.com/pricing/ returns HTTP
  200 and is a quote-request page: it carries the line "Priced to run revenue, not hurt
  the bottom line", a feature grid (Out-of-the-box, RevAI, RevDB, Expert Support) and a
  "Get a quote" form. No tier is named, no price, currency, billing period, quota,
  overage or limit appears anywhere on the page. Every commercial term is set by
  negotiation on an enterprise agreement.
