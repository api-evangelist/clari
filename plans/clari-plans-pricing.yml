api_access:
  separately_priced: false
  note: >-
    There is no API-only tier and no metered API pricing. API access is a function of
    the platform subscription: the Revenue API token is generated in Account Settings
    (and a CSM must grant access to the token tool), and the Copilot API keys live in
    Workspace Settings > Integrations. The MCP server additionally requires an admin
    toggle and, per Clari, the Salesloft Agentic add-on.
  quotas_are_contractual: true
